<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T Sports HD — Live Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      width: 100%;
      max-width: 960px;
      background: #1e1e2f;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 80px rgba(59, 130, 246, 0.08);
    }

    /* Header Bar */
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(135deg, #252542 0%, #1e1e36 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .player-header .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      animation: pulse-badge 2s ease-in-out infinite;
    }

    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .channel-name {
      color: #e2e8f0;
      font-size: 15px;
      font-weight: 600;
    }

    .channel-subtitle {
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
    }

    .viewer-count {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
    }

    .viewer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* Video Area */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }

    /* Error State */
    .error-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
    }

    .error-overlay.visible {
      display: flex;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .error-msg {
      color: #f87171;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .error-hint {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .retry-btn {
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    /* Footer */
    .player-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(135deg, #1a1a30 0%, #1e1e36 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .quality-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quality-badge {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .stream-status {
      color: #475569;
      font-size: 11px;
    }

    .powered-by {
      color: #334155;
      font-size: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <!-- Header -->
    <div class="player-header">
      <div class="channel-info">
        <span class="live-badge">Live</span>
        <div>
          <div class="channel-name">T Sports HD</div>
          <div class="channel-subtitle">Live Broadcast</div>
        </div>
      </div>
      <div class="viewer-count">
        <span class="viewer-dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>

    <!-- Video -->
    <div class="video-wrapper">
      <video id="videoPlayer" controls autoplay playsinline></video>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading stream...</div>
      </div>

      <div class="error-overlay" id="errorOverlay">
        <div class="error-icon">📡</div>
        <div class="error-msg">Stream Unavailable</div>
        <div class="error-hint">The broadcast may be offline or the link has expired</div>
        <button class="retry-btn" onclick="initPlayer()">Retry Connection</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="player-footer">
      <div class="quality-info">
        <span class="quality-badge" id="qualityBadge">HD</span>
        <span class="stream-status" id="streamInfo">Initializing...</span>
      </div>
      <span class="powered-by">HLS Player</span>
    </div>
  </div>

  <script>
    const STREAM_URL = 'https://tvsen7.aynaott.com/tsports-hd/tracks-v1a1/mono.ts.m3u8';
    const video = document.getElementById('videoPlayer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    const statusText = document.getElementById('statusText');
    const streamInfo = document.getElementById('streamInfo');
    const qualityBadge = document.getElementById('qualityBadge');

    let hls = null;
    let retryCount = 0;
    const MAX_RETRIES = 5;

    function showLoading() {
      loadingOverlay.classList.remove('hidden');
      errorOverlay.classList.remove('visible');
    }

    function hideLoading() {
      loadingOverlay.classList.add('hidden');
    }

    function showError() {
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.add('visible');
    }

    function updateStatus(text) {
      statusText.textContent = text;
    }

    function updateStreamInfo(text) {
      streamInfo.textContent = text;
    }

    function initPlayer() {
      showLoading();
      updateStatus('Connecting...');

      // Destroy previous instance
      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          maxBufferLength: 15,
          maxMaxBufferLength: 30,
          startLevel: -1, // auto quality
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function (e, data) {
          hideLoading();
          updateStatus('● Watching Live');
          updateStreamInfo(data.levels.length + ' quality levels');
          video.play().catch(() => {});
          retryCount = 0;
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function (e, data) {
          const level = hls.levels[data.level];
          if (level) {
            const h = level.height;
            const label = h >= 1080 ? 'FHD' : h >= 720 ? 'HD' : h >= 480 ? 'SD' : 'LD';
            qualityBadge.textContent = label;
            updateStreamInfo(level.width + '×' + h + ' • ' + Math.round(level.bitrate / 1000) + ' kbps');
          }
        });

        hls.on(Hls.Events.ERROR, function (e, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (retryCount < MAX_RETRIES) {
                  retryCount++;
                  updateStatus('Reconnecting (' + retryCount + '/' + MAX_RETRIES + ')...');
                  setTimeout(() => hls.startLoad(), 2000);
                } else {
                  showError();
                  updateStatus('Disconnected');
                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                showError();
                updateStatus('Error');
                break;
            }
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS
        video.src = STREAM_URL;
        video.addEventListener('loadedmetadata', function () {
          hideLoading();
          updateStatus('● Watching Live');
          updateStreamInfo('Native HLS');
          video.play().catch(() => {});
        });
        video.addEventListener('error', function () {
          showError();
        });
      } else {
        showError();
        updateStreamInfo('Browser not supported');
      }
    }

    // Start
    initPlayer();
  </script>
</body>
</html>
